# docker compose up --build        -> web on :3000, API on :8000
# make ingest                      -> index the FastAPI docs (first run downloads the models)
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      NEXUS_VECTOR_STORE: qdrant
      NEXUS_QDRANT_URL: http://qdrant:6333
      NEXUS_REDIS_URL: redis://redis:6379/0
      NEXUS_EMBEDDER: ${NEXUS_EMBEDDER:-fastembed:BAAI/bge-small-en-v1.5}
      NEXUS_RERANKER: ${NEXUS_RERANKER:-none}  # e.g. fastembed:BAAI/bge-reranker-base (slow on CPU, see bench/README.md)
      NEXUS_RERANK_CANDIDATES: ${NEXUS_RERANK_CANDIDATES:-20}
      NEXUS_FUSION: ${NEXUS_FUSION:-weighted}
      NEXUS_DENSE_WEIGHT: ${NEXUS_DENSE_WEIGHT:-0.4}
      NEXUS_CORS_ORIGINS: '["http://localhost:3000"]'
      NEXUS_ADMIN_TOKEN: ${NEXUS_ADMIN_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - nexus-data:/data
      - nexus-models:/models
      - ./data:/corpus:ro
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  qdrant:
    image: qdrant/qdrant:v1.20
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Optional: `docker compose --profile pgvector up` and set NEXUS_VECTOR_STORE=pgvector,
  # NEXUS_PG_DSN=postgresql://rag:rag@postgres:5432/rag on the api service.
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [pgvector]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  nexus-data:
  nexus-models:
  qdrant-data:
  pg-data:

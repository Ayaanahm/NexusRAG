name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          NEXUS_TEST_PG_DSN: postgresql://rag:rag@localhost:5432/rag

  retrieval-smoke:
    # Runs the benchmark end to end with the small offline embedder, so the eval
    # scripts can't silently rot. The full BGE benchmark is `make bench`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: ./scripts/fetch_data.sh
      - run: |
          cd backend
          python eval/run_retrieval.py fastapi --docs ../data/fastapi/docs/en/docs \
            --include-root ../data/fastapi/docs_src --embedder wordllama --tag ci --out /tmp/results
          python -c "import json; r=json.load(open('/tmp/results/fastapi-ci.json')); assert r['configs']['hybrid (RRF, k=60)']['hit@10'] > 0.8, r"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

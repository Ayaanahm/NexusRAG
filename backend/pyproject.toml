[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusrag"
version = "0.1.0"
description = "Hybrid-search RAG engine for technical documentation: BM25 + vectors, re-ranking, cited streaming answers."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.12",
  "snowballstemmer>=2.2",
  "wordllama>=0.4",
  "fastembed>=0.6",
  "qdrant-client>=1.12",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "httpx>=0.27",
  "anthropic>=0.49",
]

[project.optional-dependencies]
local-models = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["nexusrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905", "E501", "SIM905"]  # Depends()/File() defaults; zip strictness; long strings
